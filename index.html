<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9dff8">
<title>seventh-month</title>
<style>
:root{--sky:#b9dff8;--sky2:#d8efff;--ink:#25313b;--white:#fff;--yellow:#fee783;--line:#e7eaf0;--muted:#82909d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{background:linear-gradient(145deg,#c5e7fb,#e4f4ff);display:flex;justify-content:center;align-items:center;overflow:hidden}
.phone{width:min(100%,480px);height:100dvh;max-height:980px;background:#f6f8fb;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){.phone{height:min(94dvh,900px);border-radius:30px;box-shadow:0 20px 70px #6595b255;border:5px solid #ffffffaa}}
.status{height:28px;flex-shrink:0;padding:7px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;background:var(--sky)}
.header{background:var(--sky);display:flex;align-items:center;gap:12px;padding:10px 16px 14px;flex-shrink:0}
.back{font-size:27px;font-weight:300;line-height:1;color:#304d60}.avatar{width:43px;height:43px;border-radius:16px;object-fit:cover;background:#fff;border:2px solid #ffffffb8}
.contact{flex:1;min-width:0}.contact strong{font-size:17px;display:block}.contact small{font-size:12px;color:#527084}.head-icons{font-size:20px;letter-spacing:10px;white-space:nowrap}
.chat{flex:1;overflow-y:auto;padding:18px 13px 14px;background-color:#eaf5fc;background-image:radial-gradient(#cfe8f8 1px,transparent 1px);background-size:19px 19px;scroll-behavior:smooth}
.day{text-align:center;font-size:11px;color:#708594;margin:0 auto 18px;background:#d7eaf7d9;border-radius:12px;width:max-content;padding:6px 12px}
.msgrow{display:flex;align-items:flex-end;gap:7px;margin:11px 0;animation:pop .2s ease-out}.msgrow.out{justify-content:flex-end}.mini-avatar{width:28px;height:28px;border-radius:10px;object-fit:cover;flex-shrink:0;background:white}
.bubble{max-width:82%;padding:10px 12px;border-radius:5px 16px 16px 16px;background:#fff;font-size:14px;line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #4e6e8010}.out .bubble{background:var(--yellow);border-radius:16px 5px 16px 16px}.stamp{font-size:10px;color:#8a9aa6;align-self:flex-end;margin:0 2px 3px;white-space:nowrap}
.typing{display:flex;gap:4px;align-items:center;min-width:53px;height:34px}.typing i{width:6px;height:6px;background:#9daab5;border-radius:50%;animation:dot 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.composer{background:#fff;padding:10px 11px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0}
.inputline{display:flex;align-items:center;gap:8px}.plus{font-size:24px;color:#8c9aa6;width:25px;text-align:center}.inputwrap{display:flex;align-items:center;flex:1;border:1px solid #dfe4e9;border-radius:22px;min-height:42px;background:#fff;padding:5px 7px 5px 13px}.inputwrap textarea{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:0;flex:1;min-height:28px;max-height:132px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:#263540;padding:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.send{border:0;border-radius:17px;background:#e9c84e;padding:8px 13px;font-weight:700;color:#4c4322;cursor:pointer}.send:disabled{opacity:.4;cursor:default}.tools{display:flex;gap:20px;padding:9px 6px 0;color:#94a0aa;font-size:18px}
.keyboard{background:#d8dde5;padding:8px 4px 8px;flex-shrink:0;user-select:none}.keyrow{display:flex;justify-content:center;gap:4px;margin-bottom:8px}.key{height:39px;flex:1;max-width:38px;background:#fff;border-radius:5px;display:grid;place-items:center;font-size:17px;box-shadow:0 1px 0 #aab0ba; color:#28313b}.key.pressed{background:#e2e6eb;transform:translateY(1px);box-shadow:inset 0 1px 2px #aeb7c288;transition:background .04s,transform .04s}.key.wide{max-width:none;flex:1.45;font-size:12px;background:#bdc5d0}.key.space{max-width:none;flex:5}.key.return{max-width:none;flex:1.6;background:#b5becb;font-size:12px}.keyrow:last-child{margin-bottom:0}.homebar{height:5px;width:125px;background:#252a30;border-radius:5px;margin:9px auto 0}
@media(max-height:700px){.key{height:32px}.keyrow{margin-bottom:5px}.keyboard{padding-top:5px}.bubble{font-size:13px;padding:8px 10px}.chat{padding-top:12px}}
</style>
</head>
<body>
<main class="phone" aria-label="Seventh month chat">
<div class="status"><span id="clock">9:41</span><span>▮▮▮　◉　▰</span></div>
<header class="header"><div class="back">‹</div><img id="headerAvatar" class="avatar" alt="Rod profile photo" src="assets/rod.jpg"><div class="contact"><strong>Rod.</strong><small id="presence">online</small></div><div class="head-icons">⌕ ⋮</div></header>
<section class="chat" id="chat" aria-live="polite"><div class="day">Today</div></section>
<section class="composer">
 <div class="inputline"><div class="plus">＋</div><div class="inputwrap"><textarea id="draft" rows="1" autocomplete="off" placeholder="Write a message..." aria-label="Message draft"></textarea><button class="send" id="send" disabled>Send</button></div></div>
 <div class="tools"><span>▧</span><span>▤</span><span>☻</span><span>♫</span></div>
</section>
<div class="keyboard" id="keyboard" aria-hidden="true" style="display:none">
 <div class="keyrow"><span class="key">q</span><span class="key">w</span><span class="key">e</span><span class="key">r</span><span class="key">t</span><span class="key">y</span><span class="key">u</span><span class="key">i</span><span class="key">o</span><span class="key">p</span></div>
 <div class="keyrow"><span class="key">a</span><span class="key">s</span><span class="key">d</span><span class="key">f</span><span class="key">g</span><span class="key">h</span><span class="key">j</span><span class="key">k</span><span class="key">l</span></div>
 <div class="keyrow"><span class="key wide">⇧</span><span class="key">z</span><span class="key">x</span><span class="key">c</span><span class="key">v</span><span class="key">b</span><span class="key">n</span><span class="key">m</span><span class="key wide">⌫</span></div>
 <div class="keyrow"><span class="key wide">123</span><span class="key wide">☺</span><span class="key space"></span><span class="key wide">.</span><span class="key return">return</span></div><div class="homebar"></div>
</div>
</main>
<script>
const dialogue = [
["rod","Hello, my favorite person. Warmest greetings from your coolest boyfriend, hehe. It’s our seventh month already, can you believe that? Seven months of us, seven months of having you in my life, and seven months of finding new reasons to be grateful that somehow, out of all the people in this world, I got to meet you and call you mine."],
["jose","sayaang, what's this?"],
["rod","Just a lil something for you. Keep reading, bebe."],
["rod","Welcome to another little corner of Hiro’s heart, specially made for my favorite person. There’s a lot of things I want to tell you today, so please bear with me, sayang. You know how I am when it comes to you. I could talk about you for hours and still feel like there are a thousand more things left unsaid."],
["jose","okay, okay, I'm listening, yoy. tell me everything"],
["rod","1. Seven months, and you’re still my favorite part of every day."],
["rod","Bebe, seven months might sound like a simple number to some people, but to me, it holds so many little moments that I wish I could keep forever. Every conversation, every silly joke, every random thing we share, even those moments when we don’t really have anything interesting to talk about. Somehow, having you around makes even the most ordinary days feel a little more special."],
["rod","I don’t think you realize how much happiness you bring into my life just by being yourself. Sometimes, I don’t even need anything extraordinary to happen. Knowing that I have you, that I can talk to you, tell you about my day, or simply exist beside you in our own little world is already enough to make me happy. And if I could choose all over again, I would still want to experience these seven months with you, including all the little things that made us who we are today."],
["jose","seven months already? :( why does time go by so fast?"],
["rod","Right? And I still have so much to tell you, mbul."],
["rod","2. You’re someone I want to keep learning, over and over again."],
["rod","Aku sadar kalau loving someone isn’t just about knowing the things you already know about them. It’s also about being willing to discover the parts that haven’t been shown yet, understanding the things that are difficult to explain, and learning how to love them better as time goes by."],
["rod","There’s still so much about you that I want to discover, bebe. The little things that make you happy, the things that bother you, the way your mind works, the dreams you keep to yourself, and even the tiny details you probably think nobody notices. I want to know those things, not because I have to, but because I genuinely want to understand you."],
["rod","And I hope you’ll always feel safe enough to show me every side of yourself. You don’t have to be happy all the time, you don’t have to have everything figured out, and you don’t have to pretend that everything is okay when it isn’t. You can be your whole, imperfect self with me. We’re still learning, and I hope we can keep learning together."],
["jose","kamu bisa nanya apapun kok ke aku, you know that, right?"],
["rod","I know, bebe. And I hope you'll always feel that you can tell me anything too."],
["rod","3. Thank you for being part of my little world."],
["rod","You know what, mbul? Sometimes I wonder how different my days would be if I had never met you. Would I still laugh at the same silly things? Would I have someone to tell all my random stories to? Would the little moments that I now associate with you mean the same thing to me?"],
["rod","I don’t know, and honestly, I don’t really want to imagine it too much. I’m just really glad that you’re here now."],
["rod","Thank you for all the time you’ve given me, for the conversations that went on longer than expected, for the little updates, the affection, and every effort you’ve made to keep us close. Thank you for letting me be part of your life, too. I know you have your own responsibilities, your own thoughts, and so many things going on outside of us, so I never want you to think that the things you do for our relationship go unnoticed."],
["rod","Even the smallest things can mean a lot to me. Sometimes, it’s not about doing something grand. Sometimes, it’s simply you remembering something I told you, checking up on me, or choosing to share a little piece of your day with me. Those things matter, and I hope you know how much I appreciate them."],
["jose","i'm happy i get to share my little world with you, sayang :D"],
["rod","And I'm happy you let me be part of it, my love."],
["rod","4. If there’s one thing I hope we never lose, it’s the willingness to choose each other."],
["rod","I’m not going to pretend that every day will always be easy, because we’re two different people with our own feelings, thoughts, and ways of understanding things. There might be days when we misunderstand each other, days when we’re tired, or days when expressing what we feel becomes a little harder than usual."],
["rod","But I hope that whenever those days come, we’ll remember that we’re on the same team."],
["rod","I doesn’t expect us to be a perfect couple, bebe. I don’t need us to get everything right all the time. What I hope for is that we can keep communicating, keep listening, and keep trying to understand each other even when it’s not the easiest thing to do. Kalau ada masalah, semoga kita bisa belajar buat menghadapi masalahnya bareng-bareng, instead of letting the problem make us forget all the good things we’ve built together."],
["rod","I want us to be able to apologize when we’re wrong, to be honest when something hurts, and to make room for each other’s feelings. I want us to keep growing, individually and together, without making either of us feel like we have to stop being ourselves to be loved."],
["rod","Seven months down, and I hope there are still so many beautiful chapters waiting for us to write."],
["jose","we'll figure things out together, okay?"],
["rod","Always, bebe. We're on the same team."],
["jose","promise?"],
["rod","Promise."],
["rod","5. A little reminder for my favorite boy."],
["rod","Please take care of yourself, okay, bebe? Eat properly, get enough rest, and don’t be too hard on yourself when things don’t go the way you planned. You deserve kindness, not only from the people around you, but also from yourself."],
["rod","I hope you remember that you don’t have to accomplish something extraordinary every single day to be worthy of appreciation. You don’t have to be productive all the time, and you don’t have to carry everything by yourself. It’s okay to slow down when you need to. It’s okay to have bad days. It’s okay to ask for help when things get overwhelming."],
["rod","And when you feel like the world is being a little too much, I hope you remember that you have someone who genuinely wishes the best for you. Someone who wants to see you happy, wants to see you achieve the things you’ve been working towards, and wants to celebrate even the little victories with you."],
["rod","Aku mungkin nggak selalu bisa ada tepat di samping kamu setiap saat, but please know that I’ll always be cheering for you. I’m proud of you for the things you accomplish, but I’m also proud of you for all the little efforts you make that other people might never see."],
["rod","You matter to me beyond what you can do or achieve. Never forget that, okay?"],
["jose","i'll take care of myself. you too, ya? don't forget about yourself, sayangg"],
["rod","Hehe, deal. We'll take care of ourselves so we can keep taking care of each other."],
["rod","6. And for our seventh month together…"],
["rod","Happy seven months, baby. Thank you for being here, for being you, and for sharing this little journey with me. Thank you for every memory we’ve made so far, for every laugh, every sweet moment, every lesson, and even the moments that have taught us how to understand each other a little better."],
["rod","If I could give you something for our mensive, I’d want to give you the ability to see yourself through my eyes, even just for a moment. Maybe then you’d understand why the little things you do can make me so happy, why your presence means so much to me, and why I’m so grateful to have you in my life."],
["rod","I hope this month is kind to you. I hope the days ahead bring you reasons to smile, things to look forward to, and little moments that remind you how loved you are. And I hope that, as we move into another month together, we continue making memories that we’ll look back on someday with the biggest smiles on our faces."],
["rod","Here’s to our seventh month, to all the ordinary days that become special because we share them, to the things we’re still learning about each other, and to every little adventure that awaits us."],
["rod","I love you, baby. More than I could ever fit into one message, more than these little paragraphs could ever explain. And although I can’t predict every little thing that the future has in store for us, I’m happy that I get to share this part of my life with you."],
["rod","Happy 7th mensiversary, my favorite person."]
];
const chat=document.getElementById('chat'),draft=document.getElementById('draft'),send=document.getElementById('send'),presence=document.getElementById('presence');
let index=0, waitingForSend=false, isTyping=false, awaitingJoseTap=false, typingStarted=false;
draft.readOnly=true;
const keyboard=document.getElementById("keyboard");
const avatarUrl='assets/rod.jpg';
function scrollBottom(){chat.scrollTop=chat.scrollHeight}
function addBubble(who,text){const row=document.createElement('div');row.className='msgrow '+(who==='jose'?'out':'in');if(who==='rod'){const img=document.createElement('img');img.className='mini-avatar';img.src=avatarUrl;img.alt='';img.onerror=()=>img.style.visibility='hidden';row.appendChild(img)}
const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);
const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent='now';row.appendChild(stamp);chat.appendChild(row);scrollBottom()}
function addTyping(){const row=document.createElement('div');row.className='msgrow in';row.id='typingRow';const img=document.createElement('img');img.className='mini-avatar';img.src=avatarUrl;img.alt='';img.onerror=()=>img.style.visibility='hidden';row.appendChild(img);const b=document.createElement('div');b.className='bubble typing';b.innerHTML='<i></i><i></i><i></i>';row.appendChild(b);chat.appendChild(row);scrollBottom()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function resizeDraft(){draft.style.height='auto';draft.style.height=Math.min(draft.scrollHeight,132)+'px'}
function tapKey(ch){let target=null;if(ch===' ')target=keyboard.querySelector('.key.space');else{const wanted=ch.toLowerCase();target=[...keyboard.querySelectorAll('.key')].find(k=>k.textContent.trim().toLowerCase()===wanted)}if(!target)return;target.classList.add('pressed');setTimeout(()=>target.classList.remove('pressed'),115)}
async function typeDraft(text){draft.value='';draft.readOnly=true;resizeDraft();isTyping=true;typingStarted=true;await sleep(1000+Math.random()*1000);return new Promise(resolve=>{let i=0;const step=()=>{if(i>=text.length){isTyping=false;draft.readOnly=false;waitingForSend=true;send.disabled=!draft.value.trim();presence.textContent='online';resolve();return}const ch=text[i++];tapKey(ch);draft.value+=ch;resizeDraft();send.disabled=false;scrollBottom();let delay=82+Math.random()*75;if(/[.,!?…]/.test(ch))delay+=190+Math.random()*150;else if(ch===' ')delay+=18;setTimeout(step,delay)};step()})}
async function run(){if(index>=dialogue.length)return;const [who,text]=dialogue[index];if(who==='rod'){await sleep(900);presence.textContent='typing…';addTyping();const delay=text.length>360?4200:text.length>150?3200:2400;await sleep(delay);document.getElementById('typingRow')?.remove();addBubble('rod',text);presence.textContent='online';index++;run()}else{await sleep(350);awaitingJoseTap=true;typingStarted=false;waitingForSend=false;draft.readOnly=true;send.disabled=true;presence.textContent='online'}}
draft.addEventListener('focus',()=>{if(awaitingJoseTap&&!typingStarted){awaitingJoseTap=false;keyboard.style.display='block';keyboard.setAttribute('aria-hidden','false');typeDraft(dialogue[index][1]);}});
send.addEventListener('click',()=>{if(!waitingForSend||!draft.value.trim())return;const text=draft.value.trim();addBubble('jose',text);draft.value='';resizeDraft();draft.readOnly=true;send.disabled=true;waitingForSend=false;typingStarted=false;keyboard.style.display='none';keyboard.setAttribute('aria-hidden','true');draft.blur();index++;sleep(800).then(run)});
draft.addEventListener('input',()=>{resizeDraft();if(!waitingForSend)send.disabled=true});
draft.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click()}});
document.getElementById('headerAvatar').onerror=function(){this.style.background='#fff';this.style.objectFit='contain';this.removeAttribute('src');this.alt='R';this.style.padding='8px'};
function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,30000);
setTimeout(run,900);
</script>
</body>
</html>
